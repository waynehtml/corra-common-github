[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oeds-common"
version = "1.1.0"
description = "Common utilities for OEDS"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
  "azure-identity>=1.25.1",
  "jinja2>=3.1.0",
  "pandas>=1.5.3",
  "databricks-sdk>=0.80.0",
  "jmespath>=1.0.1",
  "pydantic>=2.0"
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["oeds*"]
